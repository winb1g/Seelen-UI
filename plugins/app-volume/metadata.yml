id: "@winb1g/tb-app-volume"
metadata:
  displayName: App Volume
  description: Scroll over this toolbar button to change the volume of the app you are currently using, not the whole system.
  tags:
    - toolbar
    - volume
    - audio
icon: IoVolumeMediumOutline
target: "@seelen/fancy-toolbar"
plugin:
  scopes:
    - Media
    - FocusedApp
  template: |-
    const norm = (p) => (p ? String(p).replaceAll("/", "\\").toLowerCase() : null);
    const exe = norm(focusedApp && focusedApp.exe);
    const sessions = exe && defaultOutputDevice
      ? defaultOutputDevice.sessions.filter((s) => !s.isSystem && norm(s.iconPath) === exe)
      : [];
    if (!sessions.length) return icon("IoVolumeOffOutline");
    const level = Math.max(...sessions.map((s) => s.volume));
    return sessions.every((s) => s.muted)
      ? icon("IoVolumeMuteOutline")
      : level >= 0.66
        ? icon("IoVolumeHighOutline")
        : level >= 0.33
          ? icon("IoVolumeMediumOutline")
          : level > 0
            ? icon("IoVolumeLowOutline")
            : icon("IoVolumeOffOutline");
  tooltip: |-
    const norm = (p) => (p ? String(p).replaceAll("/", "\\").toLowerCase() : null);
    const exe = norm(focusedApp && focusedApp.exe);
    const sessions = exe && defaultOutputDevice
      ? defaultOutputDevice.sessions.filter((s) => !s.isSystem && norm(s.iconPath) === exe)
      : [];
    const name = (focusedApp && focusedApp.name) || "App";
    if (!sessions.length) return name + ": no audio";
    const level = Math.max(...sessions.map((s) => s.volume));
    return name + ": " + (sessions.every((s) => s.muted) ? "muted" : (level * 100).toFixed(0) + "%");
  onWheelUp: |-
    const STEP = 0.05;
    const norm = (p) => (p ? String(p).replaceAll("/", "\\").toLowerCase() : null);
    const exe = norm(focusedApp && focusedApp.exe);
    const sessions = exe && defaultOutputDevice
      ? defaultOutputDevice.sessions.filter((s) => !s.isSystem && norm(s.iconPath) === exe)
      : [];
    if (!sessions.length) return;
    const level = Math.min(1, Math.round((Math.max(...sessions.map((s) => s.volume)) + STEP) * 100) / 100);
    sessions.forEach((s) => invoke(SeelenCommand.SetVolumeLevel, { deviceId: defaultOutputDevice.id, sessionId: s.id, level }));
  onWheelDown: |-
    const STEP = 0.05;
    const norm = (p) => (p ? String(p).replaceAll("/", "\\").toLowerCase() : null);
    const exe = norm(focusedApp && focusedApp.exe);
    const sessions = exe && defaultOutputDevice
      ? defaultOutputDevice.sessions.filter((s) => !s.isSystem && norm(s.iconPath) === exe)
      : [];
    if (!sessions.length) return;
    const level = Math.max(0, Math.round((Math.max(...sessions.map((s) => s.volume)) - STEP) * 100) / 100);
    sessions.forEach((s) => invoke(SeelenCommand.SetVolumeLevel, { deviceId: defaultOutputDevice.id, sessionId: s.id, level }));
