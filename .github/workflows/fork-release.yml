# [fork] Builds and publishes a fork release on every merge into master. Installed copies pick it up through the
# in-app updater (fork/background/release.rs). See fork/docs/releasing.md.
name: "Fork Release"

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "documentation/**"
      - "fork/docs/**"
      - ".github/**"
      - "crowdin.yml"
  workflow_dispatch:

permissions:
  contents: write

# Queue releases instead of cancelling a half-published one; a newer pending run replaces an older pending one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release identity is set up
        run: node fork/scripts/fork-check.ts preflight "${{ github.repository }}"

      - name: Signing key secret is set
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing (see fork/docs/releasing.md)"
            exit 1
          fi

      # <upstream version>-fork.<UTC yymmddHHMM>: always increasing, and package.json is never committed.
      - name: Version
        id: version
        run: |
          base=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=${base}-fork.$(date -u +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  # Upstream's own checks ("our changes don't break upstream") + the fork's checks.
  upstream-ci:
    uses: ./.github/workflows/ci.yml

  fork-ci:
    uses: ./.github/workflows/fork-ci.yml

  build:
    needs: [preflight, upstream-ci, fork-ci]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ env.TARGET }}
          cache-key-prefix: rust-build-${{ env.TARGET }}

      - name: Install frontend dependencies & Gen Core Lib
        run: npm install

      - name: Set version
        run: npx tsx scripts/versionish.ts ci ${{ env.VERSION }}

      - name: Build Hook DLL
        run: cargo build --release --target ${{ env.TARGET }} -p sluhk

      # Two stages like upstream's workflows: compile (the key signs SHA256SUMS in `src/build.rs`), then bundle
      # unsigned. A signing bundler verifies against `plugins.updater.pubkey` in tauri.conf.json, which upstream
      # leaves empty (the key lives in code), so it fails; the installer is signed in the next step instead.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --ci --verbose --no-bundle --target ${{ env.TARGET }}
          npx tauri bundle --ci --verbose --target ${{ env.TARGET }} --no-sign --no-binary-patching

      # Asset names without spaces (GitHub would rename them), containing "x64" for the update manifest.
      - name: Collect and sign installer
        shell: bash
        env:
          # `tauri signer sign` reads TAURI_PRIVATE_KEY* (as in upstream's workflows), `tauri build` TAURI_SIGNING_*.
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release
          installer="release/Seelen.UI.Tweaks_${VERSION}_x64-setup.exe"
          cp "target/${TARGET}/release/bundle/nsis/Seelen UI_${VERSION}_x64-setup.exe" "$installer"
          npx tauri signer sign "$installer"
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      # Refuse to publish an update that installed copies couldn't verify.
      - name: Signed with the fork key
        run: node fork/scripts/fork-check.ts key-match release/*.sig

      - name: Create release
        id: release
        run: |
          base=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          body="Unofficial build of [Seelen UI](https://github.com/eythaann/Seelen-UI) (upstream \`${base}\` line) with the fork changes listed in [FORK.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/FORK.md).

          **Install:** download \`Seelen.UI.Tweaks_${VERSION}_x64-setup.exe\` below. Already installed? Open Settings and click the download icon in the header."
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="v${VERSION}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="Seelen UI Tweaks v${VERSION}" \
            -f body="${body}" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Upload installer
        uses: svenstaro/upload-release-action@v2
        with:
          release_id: ${{ steps.release.outputs.id }}
          file: release/*
          file_glob: true

      # Published but not "latest" yet, so download URLs are final before the updater can see the release.
      - name: Publish release
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" -F draft=false -f make_latest=false

      - name: Generate update manifest
        uses: ./.github/actions/generate-update-manifest
        with:
          release-id: ${{ steps.release.outputs.id }}
          version: ${{ env.VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark as latest (installed copies update now)
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" -f make_latest=true
