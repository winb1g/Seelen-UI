# [fork] Fork-only checks, additive to upstream's ci.yml (which stays enabled and runs on every PR).
# See fork/docs/ci.md.
name: "Fork CI"

on:
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-rules:
    name: Fork rules (hooks, upstream-touch guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fork hooks still in place
        run: node fork/scripts/fork-check.ts hooks

      # Upstream sync PRs change upstream files by definition.
      - name: Changed upstream files are declared in FORK.md
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'sync/upstream')
        run: node fork/scripts/fork-check.ts guard "origin/${{ github.base_ref }}"

  fork-tests:
    name: Fork tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "fork/**/*.test.ts"
