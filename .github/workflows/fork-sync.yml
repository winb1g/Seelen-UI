# [fork] Monthly upstream merge, opened as a PR so upstream CI and fork CI both run on the result before it lands.
# See fork/docs/ci.md.
#
# Needs the FORK_SYNC_TOKEN secret (fine-grained PAT, this repo only: Contents, Pull requests and Workflows read &
# write). The default GITHUB_TOKEN can't push upstream's workflow changes, and PRs it opens don't trigger CI.
name: "Fork Upstream Sync"

on:
  schedule:
    - cron: "23 15 1 * *" # 1st of every month, 15:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  UPSTREAM: https://github.com/eythaann/Seelen-UI.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync token is set
        env:
          HAS_TOKEN: ${{ secrets.FORK_SYNC_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Repository secret FORK_SYNC_TOKEN is missing (see fork/docs/ci.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Merge upstream into a sync branch
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          open_pr=$(gh pr list --base master --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("sync/upstream"))][0].headRefName // empty')
          if [ -n "$open_pr" ]; then
            echo "Sync PR from \`$open_pr\` is still open: merge or close it first." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="sync/upstream-$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          if ! git merge --no-edit -m "chore(sync): merge upstream/master" upstream/master; then
            {
              echo "## Upstream merge has conflicts"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/'
              echo
              echo 'Resolve locally (see FORK.md > Workflow):'
              echo
              echo '```bash'
              echo "git switch -c $branch origin/master"
              echo 'git fetch upstream && git merge upstream/master'
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi

          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(sync): merge upstream $(date -u +%Y-%m-%d)" \
            --body "Monthly merge of [upstream](https://github.com/eythaann/Seelen-UI) \`master\` (\`$(git rev-parse --short upstream/master)\`).

          Before merging:
          - [ ] Upstream CI and Fork CI are green (fork hooks still in place).
          - [ ] No new upstream workflow to disable (FORK.md > Upstream workflows).
          - [ ] Fork features still work after the next release."
          echo "Opened sync PR from \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
